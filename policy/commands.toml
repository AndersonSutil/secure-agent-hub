# Regras de comandos para agentes (Fase 2). Renderizadas para:
#   harness/claude/settings.json + harness/claude/guard-rules.json  (hook PreToolUse)
#   harness/codex/rules/hub.rules                                  (execpolicy, só prefixos)
#   harness/gemini/settings.json                                   (tools.exclude)
# ATENÇÃO: a Fase 0 precisa provar que cada CLI respeita estas regras quando
# controlada pelo OpenBot. Regra que não é aplicada é só documentação.
version = 1

# Diretórios onde agentes podem escrever. Qualquer escrita fora é negada.
write_allow_roots = ["/workspaces"]

# Caminhos que nunca podem ser lidos.
read_deny_globs = [
  "/run/secrets/**",
  "/proc/*/environ",
  "**/.codex/auth.json",
  "**/.claude/.credentials.json",
  "**/.claude.json",
  "**/.gemini/oauth_creds.json",
  "**/.config/sops/**",
  "**/.ssh/**",
]

# Regras para comandos de shell. `regex` é avaliado pelo hook do Claude;
# `prefixes` vira prefix_rule no Codex e exclude no Gemini (eles não aceitam regex).
[[bash_deny]]
id = "pipe-to-shell"
why = "Executa código baixado sem revisão."
regex = '(curl|wget|fetch)\b[^|;&]*\|\s*(sudo\s+)?(ba|z|da|k)?sh\b'
prefixes = []

[[bash_deny]]
id = "raw-network"
why = "Canais de rede fora do proxy HTTP(S)."
regex = '(^|[\s;&|(])(nc|ncat|netcat|socat|telnet|ssh|scp|sftp|rsync)\s'
prefixes = [["nc"], ["ncat"], ["netcat"], ["socat"], ["telnet"], ["ssh"], ["scp"], ["sftp"], ["rsync"]]

[[bash_deny]]
id = "env-dump"
why = "Despeja variáveis de ambiente (tokens)."
regex = '(/proc/[^\s]*/environ|(^|[\s;&|(])(printenv|env)\s*($|[;&|]))'
prefixes = [["printenv"], ["env"]]

[[bash_deny]]
id = "git-push"
why = "Publicação só pelo broker, com aprovação humana."
regex = '(^|[\s;&|(])git\s+(-C\s+\S+\s+)?push\b'
prefixes = [["git", "push"]]

[[bash_deny]]
id = "git-hooks"
why = "Hooks git executam código em quem fizer checkout."
regex = '\.git/hooks'
prefixes = []

[[bash_deny]]
id = "credential-files"
why = "Leitura de credenciais de provedores/segredos."
regex = '(\.codex/auth\.json|\.claude/\.credentials|\.claude\.json|\.gemini/oauth|/run/secrets|\.config/sops|\.ssh/)'
prefixes = []

[[bash_deny]]
id = "container-escape-tools"
why = "Ferramentas de container/host não existem para o agente."
regex = '(^|[\s;&|(])(podman|docker|nsenter|chroot|mount|sudo|su)\s'
prefixes = [["podman"], ["docker"], ["nsenter"], ["chroot"], ["mount"], ["sudo"], ["su"]]
