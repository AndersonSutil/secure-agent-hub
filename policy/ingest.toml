# Regras de ingestão do hub-rag (lidas em runtime).
# Conteúdo "trusted" passa só pelo filtro de arquivos e de segredos.
# Conteúdo "untrusted" e escritas de memória ("agent") passam também por
# saneamento + classificador de prompt injection.
version = 1

[files]
max_bytes = 1_048_576
# Globs relativos à raiz da fonte; qualquer correspondência é ignorada.
ignore_globs = [
  "**/.git/**", "**/node_modules/**", "**/.venv/**", "**/__pycache__/**",
  "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx",
  "**/id_rsa*", "**/id_ed25519*", "**/auth.json", "**/.credentials.json",
  "**/oauth_creds.json", "**/*.sops.*", "**/secrets/**", "**/*.age",
  "**/*.rbxl", "**/*.rbxm", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif",
  "**/*.webp", "**/*.mp3", "**/*.ogg", "**/*.wav", "**/*.mp4", "**/*.zip",
  "**/*.tar*", "**/*.exe", "**/*.so", "**/*.dll",
]
# Extensões indexadas (o resto é ignorado).
text_extensions = [
  ".md", ".mdx", ".txt", ".rst", ".html", ".htm", ".pdf",
  ".lua", ".luau", ".py", ".ts", ".tsx", ".js", ".json", ".toml", ".yaml", ".yml",
]

[secrets]
# Chunk que casar com qualquer padrão é descartado (nunca indexado) e gera alerta.
patterns = [
  'sk-[A-Za-z0-9_\-]{20,}',              # OpenAI / Anthropic style
  'sk-ant-[A-Za-z0-9_\-]{20,}',
  'gh[pousr]_[A-Za-z0-9]{30,}',          # GitHub tokens
  'github_pat_[A-Za-z0-9_]{40,}',
  'AKIA[0-9A-Z]{16}',                    # AWS access key
  'AIza[0-9A-Za-z_\-]{35}',              # Google API key
  'xox[baprs]-[A-Za-z0-9\-]{10,}',       # Slack
  '-----BEGIN [A-Z ]*PRIVATE KEY-----',
  'AGE-SECRET-KEY-1[0-9A-Z]{50,}',
  'hf_[A-Za-z0-9]{30,}',                 # Hugging Face
]

[sanitize]
# Faixas Unicode removidas de conteúdo não confiável.
strip_ranges = [
  ["U+200B", "U+200F"],   # zero-width + marcas LTR/RTL
  ["U+202A", "U+202E"],   # embeddings/overrides bidi
  ["U+2060", "U+2064"],   # word joiner, invisíveis
  ["U+2066", "U+2069"],   # isolates bidi
  ["U+FEFF", "U+FEFF"],   # BOM / ZWNBSP
  ["U+E0000", "U+E007F"], # tag characters (ASCII smuggling)
  ["U+FE00", "U+FE0F"],   # variation selectors (smuggling via emoji)
  ["U+E0100", "U+E01EF"], # variation selectors suplementares
]
strip_html_comments = true
# Imagens markdown com URL externa são um canal de exfiltração clássico.
strip_external_markdown_images = true
# Links externos viram texto simples "[texto] (dominio)".
defang_external_links = true

[guard]
# Prompt Guard 2 é gated no Hugging Face; o fallback só entende inglês.
model = "meta-llama/Llama-Prompt-Guard-2-86M"
fallback_model = "protectai/deberta-v3-base-prompt-injection-v2"
threshold = 0.80
apply_to_trust = ["untrusted", "agent"]
# Sem modelo disponível: "quarantine" (fail-closed) ou "allow" (fail-open).
on_unavailable = "quarantine"

[chunk]
max_chars = 1200
overlap = 150

[memory]
max_bytes = 2048
ttl_days = 90
